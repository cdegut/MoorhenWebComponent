<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moorhen in an iframe: test host</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem 2rem; }
      ul { padding-left: 1.2rem; }

  <body>
    <h1>Moorhen web component inside an iframe</h1>
    <ul id="scenarios"></ul>

      <dt>Expected</dt><dd id="expected"></dd>
      <dt>Parent crossOriginIsolated</dt><dd id="parent-coi"></dd>
      <dt>Iframe src</dt><dd id="frame-src"></dd>
      <dt>Result from iframe</dt><dd id="result">waiting…</dd>
    </dl>
    <div id="frame-container"></div>
    <script type="module" src="/src/iframe-host.ts"></script>
